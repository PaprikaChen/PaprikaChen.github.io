<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Paprika Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=20261122" />
</head>
<body class="inner-page">

  <nav class="navbar">
    <a class="nav-logo" href="index.html">Paprika</a>
    <div class="nav-links">
      <a href="research.html" data-i18n="nav.research">Research</a>
      <a href="project.html" class="active" data-i18n="nav.project">Project</a>
      <a href="game.html" data-i18n="nav.game">Game</a>
      <a href="about.html" data-i18n="nav.about">About Me</a>
    </div>
    <button class="lang-toggle" id="langToggle" aria-label="Toggle language">中文</button>
  </nav>

  <div class="page-banner-wrap project-banner-wrap" id="bannerWrap">
    <div class="banner-canvas-wrap">
      <div style="width: 1500px; height: 500px" data-us-project="DiHnaIHFeiGqyzLsEmXq"></div>
    </div>
  </div>

  <main class="inner-main no-top-rule">

    <div class="card-grid">

      <article class="card card--wide">
        <a class="card-thumb" href="https://skfb.ly/psBOP" target="_blank" rel="noopener">
          <img src="project/3.png" alt="Maya bathroom scene" />
        </a>
        <div class="card-body">
          <div class="card-summary">
            <div class="card-meta">
              <span class="card-tag" data-i18n="project.tag3">Maya · Substance Painter</span>
              <h2 class="card-title" data-i18n="project.title3">Maya + Substance Painter: Organic Modeling and Rendering</h2>
              <p class="card-teaser" data-i18n="project.teaser3"></p>
            </div>
            <button class="card-expand-btn" aria-expanded="false">
              <span data-i18n="project.expand">Details</span>
              <span class="expand-arrow">↓</span>
            </button>
          </div>
          <div class="card-details">
            <div class="card-details-inner">
              <p class="card-desc" data-i18n="project.desc3"></p>
              <a class="card-link" href="https://skfb.ly/psBOP" target="_blank" rel="noopener" data-i18n="project.link3">View on Sketchfab →</a>
            </div>
          </div>
        </div>
      </article>

    </div>
  </main>

  <script type="text/javascript">!function(){var u=window.UnicornStudio;if(u&&u.init){if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){u.init()})}else{u.init()}}else{window.UnicornStudio={isInitialized:!1};var i=document.createElement("script");i.src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.2.5/dist/unicornStudio.umd.js",i.onload=function(){if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){UnicornStudio.init()})}else{UnicornStudio.init()}},(document.head||document.body).appendChild(i)}}();</script>

  <script>
    function scaleBanner() {
      var wrap = document.getElementById('bannerWrap');
      var canvasWrap = wrap && wrap.querySelector('.banner-canvas-wrap');
      var inner = wrap && wrap.querySelector('[data-us-project]');
      if (!inner || !canvasWrap) return;
      var scale = canvasWrap.offsetWidth / 1500;
      inner.style.transform = 'scale(' + scale + ')';
      inner.style.transformOrigin = 'top left';
      canvasWrap.style.height = Math.round(500 * scale) + 'px';
    }
    document.addEventListener('DOMContentLoaded', scaleBanner);
    window.addEventListener('resize', scaleBanner);

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.card-expand-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var card = btn.closest('.card--wide');
          var isOpen = card.classList.toggle('is-open');
          var arrow = btn.querySelector('.expand-arrow');
          if (arrow) arrow.textContent = isOpen ? '↑' : '↓';
          btn.setAttribute('aria-expanded', String(isOpen));
        });
      });
    });
  </script>

  <script src="js/i18n.js?v=20261122"></script>

  <div class="visitor-count">
    <span class="visitor-label">visitors</span>
    <span class="visitor-num" id="visitorNum">—</span>
  </div>
  <script>
    fetch('https://api.countapi.xyz/hit/paprikachen-io/visits')
      .then(function(r){ return r.json(); })
      .then(function(d){
        var el = document.getElementById('visitorNum');
        if (el && d.value) el.textContent = d.value.toLocaleString();
      })
      .catch(function(){});
  </script>
</body>
</html>
